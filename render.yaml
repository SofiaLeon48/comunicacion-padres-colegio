# Despliegue de la API en Render (https://render.com) — "Blueprint"
services:
  - type: web
    name: conecta-escolar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false          # se pega a mano: cadena de conexión de Neon
      - key: JWT_SECRET
        generateValue: true  # Render genera una clave aleatoria
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: CORS_ORIGIN_REGEX     # Vercel + app móvil (Capacitor)
        value: (https://.*\.vercel\.app|https?://localhost|capacitor://localhost)
      - key: BREVO_API_KEY         # correo por API (Render gratis bloquea SMTP)
        sync: false
      - key: CORREO_REMITENTE      # correo verificado en Brevo
        sync: false
      - key: GEMINI_API_KEY        # IA: Google AI Studio → Get API key
        sync: false
