# Genera la APK de Conecta Escolar (Capacitor) en la nube de GitHub.
# Resultado: pestaña Actions → la ejecución → "Artifacts" → ConectaEscolar-apk (contiene la .apk).
name: APK Android

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://conecta-escolar-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web y copiarla al proyecto Android
        run: npm run build:movil

      # El servidor de GitHub ya trae el SDK de Android instalado.
      - name: Compilar la APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ConectaEscolar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ConectaEscolar-apk
          path: ConectaEscolar.apk
          retention-days: 30